<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fees - Gym Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo"><img src="images/logo.png" alt="IRON WILL">IRON WILL</a>
        <ul class="nav-links">
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="admin.html">Members</a></li>
            <li><a href="attendance.html">Attendance</a></li>
            <li><a href="fees.html">Fees</a></li>
            <li><a href="workouts.html">Workouts</a></li>
            <li><a href="member.html">My Profile</a></li>
            <li><a href="settings.html">Settings</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Fees Management</h1>

        <!-- Add Fee Record -->
        <div class="form-container">
            <h2 id="feeFormTitle">Add Fee Record</h2>
            <form id="feeForm">
                <input type="hidden" id="feeId">
                <div class="form-row">
                    <div class="form-group">
                        <label for="feeMember">Member *</label>
                        <select id="feeMember" required>
                            <option value="">Select Member</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="feeAmount">Amount (&#8377;) *</label>
                        <input type="number" id="feeAmount" placeholder="Enter amount" min="0" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="feeMonth">For Month *</label>
                        <input type="month" id="feeMonth" required>
                    </div>
                    <div class="form-group">
                        <label for="feeStatus">Payment Status *</label>
                        <select id="feeStatus" required>
                            <option value="paid">Paid</option>
                            <option value="pending">Pending</option>
                            <option value="overdue">Overdue</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="feePaidDate">Paid Date</label>
                        <input type="date" id="feePaidDate">
                    </div>
                    <div class="form-group">
                        <label for="feePaymentMode">Payment Mode</label>
                        <select id="feePaymentMode">
                            <option value="cash">Cash</option>
                            <option value="upi">UPI</option>
                            <option value="card">Card</option>
                            <option value="bank-transfer">Bank Transfer</option>
                        </select>
                    </div>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                    <button type="submit" class="btn btn-primary" id="feeSubmitBtn">Add Record</button>
                    <button type="button" class="btn btn-danger" id="feeCancelBtn" style="display:none;" onclick="cancelFeeEdit()">Cancel</button>
                </div>
            </form>
        </div>

        <!-- Stats -->
        <div class="dashboard-cards">
            <div class="card">
                <h3>Total Collected</h3>
                <div class="stat" id="totalCollected">&#8377;0</div>
                <div class="label">all time</div>
            </div>
            <div class="card">
                <h3>This Month</h3>
                <div class="stat" id="monthCollected">&#8377;0</div>
                <div class="label">collected</div>
            </div>
            <div class="card">
                <h3>Pending</h3>
                <div class="stat" id="pendingCount">0</div>
                <div class="label">unpaid records</div>
            </div>
            <div class="card">
                <h3>Overdue</h3>
                <div class="stat" id="overdueCount">0</div>
                <div class="label">past due date</div>
            </div>
        </div>

        <!-- Filter -->
        <div class="search-bar">
            <select id="filterFeeMember">
                <option value="all">All Members</option>
            </select>
            <select id="filterFeeStatus">
                <option value="all">All Status</option>
                <option value="paid">Paid</option>
                <option value="pending">Pending</option>
                <option value="overdue">Overdue</option>
            </select>
            <button class="btn btn-primary" onclick="renderFees()">Filter</button>
        </div>

        <!-- Fees Table -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Member</th>
                        <th>Amount</th>
                        <th>Month</th>
                        <th>Status</th>
                        <th>Paid Date</th>
                        <th>Mode</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="feesTable">
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/store.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/fees.js"></script>
</body>
</html>
